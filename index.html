<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المدفوعات">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" id="ati" href="">
<title>دفتر المدفوعات</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e5e7eb;--pri:#0f766e;--red:#dc2626;--grn:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--bd:#2c333d;--pri:#2dd4bf;--red:#f87171;--grn:#4ade80}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--bd:#2c333d;--pri:#2dd4bf;--red:#f87171;--grn:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;padding-bottom:90px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}
h3{margin:18px 0 8px;font-size:16px}
h4{margin:14px 0 6px;font-size:15px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.box small{color:var(--mut);display:block;margin-bottom:4px;font-size:13px}
.box b{font-size:19px}
.bal{text-align:center;padding:18px;margin-bottom:10px}.bal b{font-size:30px;display:block;color:var(--pri)}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--pri);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:8px}
.row .n{font-weight:600}.row small{color:var(--mut);display:block;margin-top:2px}.row .a{text-align:left}.row .a b{display:block}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;background:var(--pri);color:#fff}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--red)}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:608px;margin:0 auto;display:flex}
.fab .btn{flex:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.two{display:flex;gap:8px}.two>*{flex:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.lbl{font-size:12px;color:var(--mut);margin:0 2px 3px;display:block}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
td.w{white-space:normal}
th{color:var(--mut);font-weight:600;background:var(--bg)}
tfoot td{font-weight:700;background:var(--bg)}
.x{border:0;background:none;color:var(--pri);font:inherit;padding:2px 6px}
.bar{height:6px;border-radius:99px;background:var(--bd);margin-top:4px;min-width:60px}.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.rh{border-bottom:3px solid var(--pri);padding-bottom:10px;margin-bottom:14px}
.rh h2{margin:0 0 4px;font-size:22px;color:var(--pri)}.rh small{color:var(--mut);display:block}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.k .box{padding:10px;text-align:center}.k b{font-size:15px}
.hero{background:var(--pri);color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}.hero small{opacity:.85;display:block}.hero b{font-size:28px}
#ob{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;max-width:640px;margin:0 auto;padding:0 12px}#ob .box{border-color:var(--red);color:var(--red);font-weight:600;margin-top:8px;font-size:14px}
.po{display:none}
textarea{height:72px;resize:none}
.nt{color:var(--mut);font-size:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:16px}
@media (max-width:480px){.k{grid-template-columns:1fr 1fr}}
@media print{
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#f3f4f6;--card:#fff;--tx:#000;--mut:#444;--bd:#bbb;--pri:#0f766e}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{padding:0;background:#fff}.wrap{max-width:none;padding:0}
.noprint,.fab,.tabs,.sheet{display:none!important}.po{display:block}
.tw{overflow:visible}thead{display:table-header-group}tr,.box{break-inside:avoid}
td,th{white-space:normal}
.st{border:0;padding:0;break-before:page}
body.pone .rps,body.pone .st:not(.sel){display:none!important}
body.pone .st.sel{break-before:auto}
}
</style>
</head>
<body>
<div id="ob" class="noprint"></div>
<div class="wrap" id="app"></div>
<script>
var KEY="pay_v2",S={ps:[],tab:"sup",cur:null,sh:null,f:null,del:false,from:"",to:"",q:""};
try{S.ps=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
if(!S.ps.length){try{var old=JSON.parse(localStorage.getItem("pay_v1"))||[],g={};
 old.forEach(function(x,i){var n=x.p||"غير محدد";(g[n]=g[n]||{id:"p"+Date.now()+Object.keys(g).length,name:n,phone:"",tx:[]}).tx.push({id:x.id,d:x.d,w:x.w,a:x.a})});
 S.ps=Object.keys(g).map(function(k){return g[k]})}catch(e){}}
var CFG={},LU=0,tm=null;
try{CFG=JSON.parse(localStorage.getItem("pay_cfg"))||{};LU=+(localStorage.getItem("pay_ts")||0)}catch(e){}
S.sy=CFG.u?"":"☁️ غير متصل بـ Turso";
function store(){try{localStorage.setItem(KEY,JSON.stringify(S.ps));localStorage.setItem("pay_ts",String(LU))}catch(e){}}
var PW="";try{PW=localStorage.getItem("pay_pw")||""}catch(e){}
function hp(p){var t="pay|"+p;try{if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}catch(e){}return Promise.resolve("b"+btoa(unescape(encodeURIComponent(t))))}
function off(){return!!CFG.u&&navigator.onLine===false}
function blocked(){if(off()){alert("لا يتوفر إنترنت.\nالتسجيل متوقف علشان بياناتك ما تتسجلش على الجهاز بس وتضيع.\nارجع للنت وكمّل.");return true}return false}
function ob(){var e=document.getElementById("ob");if(!e)return;e.innerHTML=off()?'<div class="box">⚠️ لا يتوفر إنترنت — التسجيل متوقف لحماية بياناتك</div>':S.pf?'<div class="box">⚠️ آخر تسجيل ما اترفعش للسيرفر. اتأكد من الإنترنت وجرّب المزامنة من ⚙️</div>':""}
var FH=null;
function setFy(x){S.fy=x;var e=document.getElementById("fy");if(e)e.textContent=x}
function idb(mode,fn){return new Promise(function(res,rej){var r=indexedDB.open("paydb",1);r.onupgradeneeded=function(){r.result.createObjectStore("h")};r.onsuccess=function(){var t=r.result.transaction("h",mode),o=fn(t.objectStore("h"));t.oncomplete=function(){res(o&&o.result)};t.onerror=function(){rej(t.error)}};r.onerror=function(){rej(r.error)}})}
function fperm(ask){var o={mode:"readwrite"};return FH.queryPermission(o).then(function(p){return p==="granted"?true:ask?FH.requestPermission(o).then(function(x){return x==="granted"}):false})}
function fwrite(ask){if(!FH)return Promise.resolve();
 return fperm(ask).then(function(ok){if(!ok){setFy("⚠️ الملف محتاج تفعيل، افتح 💾 واضغط حفظ الآن");return}
  return FH.createWritable().then(function(w){return w.write(JSON.stringify({v:2,ts:LU,ps:S.ps})).then(function(){return w.close()})}).then(function(){setFy("💾 اتحفظ في الملف "+FH.name+" "+new Date().toLocaleTimeString("ar-EG"))})}).catch(function(e){setFy("⚠️ فشل الحفظ في الملف: "+e.message)})}
function fpick(h){FH=h;return idb("readwrite",function(st){return st.put(h,"f")}).catch(function(){})}
function importData(txt){if(blocked())throw new Error("لا يتوفر إنترنت");var d=JSON.parse(txt),l=Array.isArray(d)?d:d.ps;if(!Array.isArray(l))throw new Error("ملف غير صالح");S.ps=l;save();S.sh=null;S.cur=null;render()}
function bk(){if(FH)return"💾 مربوط بملف: "+FH.name;var t=0;try{t=+(localStorage.getItem("pay_bk")||0)}catch(e){}return S.ps.length?(t?"💾 آخر نسخة احتياطية: "+fd(new Date(t-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)):"⚠️ لسه معملتش نسخة احتياطية"):""}
function ios(){return/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function standalone(){return navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)}
function hintOn(){try{return ios()&&!standalone()&&!localStorage.getItem("pay_hint")}catch(e){return false}}
function dl(){
 var txt=JSON.stringify({v:2,ts:LU,ps:S.ps}),name="payments-"+today()+".json",done=function(){try{localStorage.setItem("pay_bk",String(Date.now()))}catch(e){}setFy(bk())};
 try{var f=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(done).catch(function(){});return}}catch(e){}
 var b=new Blob([txt],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();done()
}
try{idb("readonly",function(st){return st.get("f")}).then(function(h){if(h){FH=h;setFy("💾 مربوط بملف: "+h.name)}}).catch(function(){})}catch(e){}
S.fy=bk();
function save(){LU=Date.now();store();fwrite(false);if(CFG.u){setSy("⏳ في الانتظار...");clearTimeout(tm);tm=setTimeout(push,800)}}
function setSy(x){S.sy=x;var e=document.getElementById("sy");if(e)e.textContent=x}
var CT={sql:"CREATE TABLE IF NOT EXISTS kv(k TEXT PRIMARY KEY, v TEXT, ts INTEGER)"};
function q(list){var u=CFG.u.replace(/^libsql:\/\//,"https://").replace(/\/+$/,"");
 return fetch(u+"/v2/pipeline",{method:"POST",headers:{"Authorization":"Bearer "+CFG.t,"Content-Type":"application/json"},body:JSON.stringify({requests:list.map(function(x){return{type:"execute",stmt:x}}).concat([{type:"close"}])})})
 .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
 .then(function(j){j.results.forEach(function(x){if(x.type==="error")throw new Error(x.error.message)});return j.results})}
function push(){if(!CFG.u)return;setSy("⏳ جاري الرفع...");
 return q([CT,{sql:"INSERT OR REPLACE INTO kv(k,v,ts) VALUES('pay',?,?)",args:[{type:"text",value:JSON.stringify(S.ps)},{type:"integer",value:String(LU)}]}])
 .then(function(){S.pf=false;ob();setSy("☁️ تم الرفع "+new Date().toLocaleTimeString("ar-EG"))}).catch(function(e){S.pf=true;ob();setSy("⚠️ فشل الرفع: "+e.message)})}
function apply(v,ts){S.ps=JSON.parse(v);LU=ts;store();S.sh=null;render();setSy("☁️ تم التحميل من Turso "+new Date().toLocaleTimeString("ar-EG"))}
function pull(){if(!CFG.u)return;setSy("⏳ جاري المزامنة...");
 return q([CT,{sql:"SELECT v,ts FROM kv WHERE k='pay'"}]).then(function(r){var rows=r[1].response.result.rows;
  if(!rows.length)return push();
  var rts=+rows[0][1].value;
  if(LU===0&&S.ps.length&&rts>0){S.rv=rows[0][0].value;S.rts=rts;S.sh="cf";render();setSy("⚠️ محتاج قرارك");return}
  if(rts>LU)apply(rows[0][0].value,rts);
  else if(rts<LU)return push();
  else setSy("☁️ متزامن")}).catch(function(e){setSy("⚠️ فشل الاتصال: "+e.message)})}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function m(n){return Number(n).toLocaleString("ar-EG",{maximumFractionDigits:2})}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function fd(d){return new Date(d+"T00:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"short",year:"numeric"})}
function sum(l){return l.reduce(function(a,x){return a+x.a},0)}
function asc(l){return l.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.id<b.id?-1:1})}
function P(id){return S.ps.filter(function(p){return p.id===id})[0]}
function total(){return S.ps.reduce(function(a,p){return a+sum(p.tx)},0)}
function inr(t){return(!S.from||t.d>=S.from)&&(!S.to||t.d<=S.to)}

function listH(){
 var q=S.q.trim().toLowerCase(),l=S.ps.filter(function(p){return!q||(p.name+" "+(p.phone||"")+" "+p.tx.map(function(t){return t.w+" "+(t.n||"")+" "+t.a}).join(" ")).toLowerCase().indexOf(q)>-1});
 if(!l.length)return'<div class="empty">'+(q?"لا توجد نتائج":'لسه مفيش موردين، اضغط "مورد جديد"')+'</div>';
 return l.map(function(p){var a=asc(p.tx),last=a.length?" · آخر دفعة "+fd(a[a.length-1].d):"";
  return'<div class="row" data-a="open" data-id="'+p.id+'"><div><div class="n">'+esc(p.name)+'</div><small>'+m(p.tx.length)+' حركة'+last+'</small></div><div class="a"><b>'+m(sum(p.tx))+'</b><small>إجمالي المدفوع</small></div></div>'}).join("")
}
function homeH(){
 return'<div class="top" style="margin-bottom:2px"><h1 style="flex:1;margin:0">💰 دفتر المدفوعات</h1><button class="btn g" data-a="gear" style="padding:8px 12px" aria-label="الإعدادات">⚙️</button></div><small id="sy" style="color:var(--mut);display:block;margin-bottom:4px">'+esc(S.sy)+'</small><small id="fy" style="color:var(--mut);display:block;margin-bottom:10px">'+esc(S.fy||"")+'</small>'+(hintOn()?'<div class="box noprint" style="margin-bottom:10px;border-color:var(--pri)"><small style="color:var(--tx);margin:0 0 8px">📱 على الآيفون: علشان بياناتك تفضل محفوظة، افتح الصفحة في Safari ← زر المشاركة ← <b>إضافة إلى الشاشة الرئيسية</b>، وبعدها استخدمه من الأيقونة.</small><button class="btn g" data-a="hidehint" style="padding:6px 12px">تمام</button></div>':'')+'<div class="box bal"><small>إجمالي ما دفعته لكل الموردين</small><b>'+m(total())+' ج.م</b></div>'+
 '<input id="q" type="search" placeholder="🔍 ابحث باسم المورد أو البيان أو المبلغ" value="'+esc(S.q)+'"><div id="lst">'+listH()+'</div>'+
 '<div class="fab"><button class="btn" data-a="addp">+ مورد جديد</button></div>'
}
function suppH(p){
 var a=asc(p.tx),run={},c=0,h='';
 a.forEach(function(x){c+=x.a;run[x.id]=c});
 h+='<div class="top noprint"><button class="btn g" data-a="back">→</button><h1 style="margin:0;flex:1">'+esc(p.name)+'</h1><button class="btn g" data-a="editp">✎</button></div>';
 h+='<div class="po rh"><h2>كشف حساب: '+esc(p.name)+'</h2><small>تاريخ الإصدار: '+fd(today())+'</small></div>';
 if(p.phone)h+='<p class="noprint" style="margin:0 0 10px"><a href="tel:'+esc(p.phone)+'" style="color:var(--pri)">📞 '+esc(p.phone)+'</a></p>';
 h+='<div class="hero"><small>إجمالي ما دفعته لهذا المورد</small><b>'+m(c)+' ج.م</b></div>';
 h+='<h3>الحركات ('+m(a.length)+')</h3>';
 if(!a.length)return h+'<div class="empty">لسه مفيش حركات، اضغط "دفعة جديدة"</div><div class="fab"><button class="btn" data-a="newt">+ دفعة جديدة</button></div>';
 h+='<div class="tw"><table><thead><tr><th>#</th><th>التاريخ</th><th>البيان</th><th>ملاحظة</th><th>المبلغ</th><th>المجموع</th><th class="noprint"></th></tr></thead><tbody>';
 a.forEach(function(x,i){h+='<tr><td>'+m(i+1)+'</td><td>'+fd(x.d)+'</td><td class="w">'+esc(x.w)+'</td><td class="w nt">'+esc(x.n||"")+'</td><td>'+m(x.a)+'</td><td><b>'+m(run[x.id])+'</b></td><td class="noprint"><button class="x" data-a="editt" data-id="'+x.id+'">✎</button></td></tr>'});
 h+='</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>'+m(c)+'</td><td>'+m(c)+'</td><td class="noprint"></td></tr></tfoot></table></div>';
 h+='<div class="noprint two"><button class="btn g" data-a="print">🖨️ طباعة / PDF</button><button class="btn g" data-a="shp" data-id="'+p.id+'">📤 مشاركة الكشف</button></div><div style="height:20px"></div>';
 return h+'<div class="fab"><button class="btn" data-a="newt">+ دفعة جديدة</button></div>'
}
function repH(){
 var h='<div class="noprint"><div class="two"><div><span class="lbl">من</span><input type="date" id="rf" value="'+esc(S.from)+'"></div><div><span class="lbl">إلى</span><input type="date" id="rt" value="'+esc(S.to)+'"></div></div><div class="two" style="margin-bottom:12px"><button class="btn g" data-a="all">كل الفترات</button><button class="btn g" data-a="month">هذا الشهر</button></div></div>';
 var G=S.ps.map(function(p){var l=asc(p.tx.filter(inr));return{p:p,l:l,t:sum(l)}}).filter(function(g){return g.l.length}).sort(function(x,y){return y.t-x.t});
 if(!G.length)return h+'<div class="empty">لا توجد دفعات في هذه الفترة</div>';
 var all=[];G.forEach(function(g){all=all.concat(g.l)});all=asc(all);
 var T=sum(all),n=all.length,a=S.from||all[0].d,b=S.to||all[n-1].d;h+='<div class="rps">';var mx=all.reduce(function(x,y){return y.a>x.a?y:x},all[0]);
 h+='<div class="rh"><h2>تقرير المدفوعات للموردين</h2><small>الفترة: من '+fd(a)+' إلى '+fd(b)+'</small><small>تاريخ الإصدار: '+fd(today())+'</small></div>';
 h+='<div class="hero"><small>إجمالي المدفوع</small><b>'+m(T)+' ج.م</b></div>';
 h+='<div class="k"><div class="box"><small>عدد الموردين</small><b>'+m(G.length)+'</b></div><div class="box"><small>عدد الدفعات</small><b>'+m(n)+'</b></div><div class="box"><small>متوسط الدفعة</small><b>'+m(T/n)+'</b></div><div class="box"><small>أكبر دفعة</small><b>'+m(mx.a)+'</b></div></div>';
 h+='<h3>ملخص الموردين</h3><div class="tw"><table><thead><tr><th>المورد</th><th>عدد</th><th>الإجمالي</th><th>النسبة</th></tr></thead><tbody>';
